<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Link Reference</title>
  <style>
    :root {
      --bg-color: #f4f4f9;
      --text-color: #333;
      --card-bg: #fff;
      --accent: #4a90e2;
      --shadow: rgba(0, 0, 0, 0.05);
    }

    body.dark {
      --bg-color: #1e1e2f;
      --text-color: #f0f0f0;
      --card-bg: #2b2b3d;
      --accent: #82aaff;
      --shadow: rgba(255, 255, 255, 0.05);
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      transition: background 0.3s, color 0.3s;
    }

    header {
      background-color: var(--accent);
      color: white;
      padding: 1rem 2rem;
      text-align: center;
      font-size: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dark-toggle {
      background: none;
      border: 2px solid white;
      color: white;
      padding: 0.3rem 0.8rem;
      font-size: 0.9rem;
      border-radius: 5px;
      cursor: pointer;
    }

    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 1rem;
    }

    .search-bar {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .category {
      margin-bottom: 2rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      overflow: hidden;
    }

    .category-header {
      background: var(--accent);
      color: white;
      padding: 0.75rem 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .category-content {
      display: none;
      padding: 1rem;
      background: var(--bg-color);
    }

    .category.open .category-content {
      display: block;
    }

    .link-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1rem 1.5rem;
      margin: 0.5rem 0;
      box-shadow: 0 2px 5px var(--shadow);
      transition: transform 0.1s ease-in-out;
    }

    .link-card:hover {
      transform: scale(1.01);
    }

    .link-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.25rem;
    }

    .link-url {
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }

    .link-url:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    My Favorite Links
    <button class="dark-toggle" onclick="toggleDarkMode()">🌙</button>
  </header>

  <div class="container">
    <input type="text" id="searchInput" class="search-bar" placeholder="Search links..." />

    <!-- Category: Work Tools -->
    <div class="category open">
      <div class="category-header" onclick="toggleCategory(this)">
        Work Tools <span>▼</span>
      </div>
      <div class="category-content">
        <div class="link-card">
          <div class="link-title">Google Docs</div>
          <a class="link-url" href="https://docs.google.com" target="_blank">https://docs.google.com</a>
        </div>
        <div class="link-card">
          <div class="link-title">Slack</div>
          <a class="link-url" href="https://slack.com" target="_blank">https://slack.com</a>
        </div>
      </div>
    </div>

    <!-- Category: Development -->
    <div class="category open">
      <div class="category-header" onclick="toggleCategory(this)">
        Development <span>▼</span>
      </div>
      <div class="category-content">
        <div class="link-card">
          <div class="link-title">GitHub</div>
          <a class="link-url" href="https://github.com" target="_blank">https://github.com</a>
        </div>
        <div class="link-card">
          <div class="link-title">Stack Overflow</div>
          <a class="link-url" href="https://stackoverflow.com" target="_blank">https://stackoverflow.com</a>
        </div>
      </div>
    </div>

    <!-- Category: Personal -->
    <div class="category open">
      <div class="category-header" onclick="toggleCategory(this)">
        Personal <span>▼</span>
      </div>
      <div class="category-content">
        <div class="link-card">
          <div class="link-title">YouTube</div>
          <a class="link-url" href="https://youtube.com" target="_blank">https://youtube.com</a>
        </div>
        <div class="link-card">
          <div class="link-title">Reddit</div>
          <a class="link-url" href="https://reddit.com" target="_blank">https://reddit.com</a>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Search functionality
    document.getElementById('searchInput').addEventListener('input', function () {
      const query = this.value.toLowerCase();
      document.querySelectorAll('.link-card').forEach(card => {
        const title = card.querySelector('.link-title').textContent.toLowerCase();
        const url = card.querySelector('.link-url').textContent.toLowerCase();
        card.style.display = (title.includes(query) || url.includes(query)) ? '' : 'none';
      });
    });

    // Collapse/expand category
    function toggleCategory(header) {
      const category = header.parentElement;
      category.classList.toggle('open');
      const arrow = header.querySelector('span');
      arrow.textContent = category.classList.contains('open') ? '▼' : '►';
    }

    // Dark mode toggle
    function toggleDarkMode() {
      document.body.classList.toggle('dark');
    }
  </script>

</body>
</html>
